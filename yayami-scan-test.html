              </select>
            </div>
          </div>
        )}
        <div className="form-row"><label className="form-label">Min. threshold (triggers shopping)</label><input className="input" type="number" value={form.minimum_threshold} onChange={e=>setForm(f=>({...f,minimum_threshold:e.target.value}))} /></div>
        <div className="form-actions">
          <button className="btn btn-primary" onClick={save} disabled={!form.name}>Add</button>
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

// ── FRIDGE ──
function Fridge({ profile }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('all');
  const [showAdd, setShowAdd] = useState(false);

  useEffect(() => { fetchItems(); }, []);

  async function fetchItems() {
    setLoading(true);
    const { data } = await supabase.from('fridge_items').select('*').order('added_date');
    setItems(data || []);
    setLoading(false);
  }

  async function removeItem(id) {
    await supabase.from('fridge_items').delete().eq('id', id);
    setItems(items => items.filter(i => i.id !== id));
    showToast('Removed from fridge');
  }

  async function decrementPortions(id, current) {
    const newVal = Math.max(0, current - 1);
    await supabase.from('fridge_items').update({ portions_remaining: newVal }).eq('id', id);
    setItems(items => items.map(i => i.id === id ? {...i, portions_remaining: newVal} : i));
    if (newVal === 0) showToast('Last portion — remove when eaten!');
  }

  const filtered = filter === 'all' ? items : items.filter(i => i.item_type === filter);
  const canEdit = profile?.role === 'admin' || profile?.role === 'member';

  return (
    <div>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6}}>
        <h1 className="page-title">Fridge & Leftovers</h1>
        {canEdit && <button className="btn btn-primary" onClick={()=>setShowAdd(true)}>+ Add</button>}
      </div>
      <p className="page-sub">Log fresh ingredients, leftovers, and bulk cook batches. Track portions remaining.</p>
      <div className="tabs">
        {[['all','All'],['fresh','Fresh'],['leftover','Leftovers'],['expiring','Use Soon']].map(([f,l])=>(
          <button key={f} className={`tab-btn ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>{l}</button>
        ))}
      </div>
      {loading ? <div className="loading">Loading fridge…</div> :
        filtered.length === 0 ? <div className="empty-state"><div className="empty-state-icon">❄️</div>Nothing here</div> :
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(160px,1fr))', gap:10}}>
          {filtered.map(item => {
            const age = Math.floor((Date.now() - new Date(item.added_date)) / 86400000);
            const isExpiring = item.item_type === 'expiring' || (item.item_type === 'leftover' && age >= 2) || (item.item_type === 'fresh' && age >= 4);
            return (
              <div key={item.id} style={{background:'var(--card)', border:`1px solid ${isExpiring?'var(--gold)':item.item_type==='leftover'?'var(--terra)':'var(--border)'}`, borderRadius:'var(--radius)', padding:12, position:'relative'}}>
                {item.item_type === 'leftover' && <span style={{position:'absolute',top:6,right:6}} className="tag" style={{background:'var(--terra-bg)',color:'var(--terra)',fontSize:10}}>LEFTOVER</span>}
                {isExpiring && <span className="tag tag-warn" style={{position:'absolute',top:6,right:6,fontSize:10}}>USE SOON</span>}
                <div style={{fontWeight:600, fontSize:13, marginBottom:4, paddingRight: isExpiring||item.item_type==='leftover'?60:0}}>{item.name}</div>
                <div style={{fontSize:12, color:'var(--mid)'}}>{item.quantity}</div>
                {item.portions_remaining != null && (
                  <div style={{display:'flex', alignItems:'center', gap:6, marginTop:6}}>
                    <span style={{fontSize:11, color:'var(--mid)'}}>Portions:</span>
                    <strong style={{fontFamily:'IBM Plex Mono,monospace', fontSize:13}}>{item.portions_remaining}</strong>
                    {canEdit && <button className="qty-btn" onClick={()=>decrementPortions(item.id, item.portions_remaining)}>−</button>}
                  </div>
                )}
                <div style={{fontSize:11, color:'var(--muted)', marginTop:4}}>{age === 0 ? 'Today' : age + 'd ago'}</div>
                {canEdit && <button className="btn btn-xs btn-danger" style={{marginTop:8, width:'100%', justifyContent:'center'}} onClick={()=>removeItem(item.id)}>Remove</button>}
              </div>
            );
          })}
        </div>
      }
      {showAdd && <AddFridgeModal onClose={()=>setShowAdd(false)} onSaved={()=>{setShowAdd(false);fetchItems();showToast('✓ Added to fridge');}} />}
    </div>
  );
}

function AddFridgeModal({ onClose, onSaved }) {
  const [form, setForm] = useState({ name:'', quantity:'', item_type:'fresh', added_date: new Date().toISOString().split('T')[0], portions_remaining: null, notes:'' });

  async function save() {
    await supabase.from('fridge_items').insert([form]);
    onSaved();
  }

  return (
    <div className="modal-overlay open">
      <div className="modal">
        <h3>Add to Fridge</h3>
        <div className="form-row"><label className="form-label">Name</label><input className="input" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} /></div>
        <div className="form-row"><label className="form-label">Quantity</label><input className="input" value={form.quantity} onChange={e=>setForm(f=>({...f,quantity:e.target.value}))} placeholder="e.g. 2 portions" /></div>
        <div className="form-row"><label className="form-label">Type</label>
          <select className="input" value={form.item_type} onChange={e=>setForm(f=>({...f,item_type:e.target.value}))}>
            <option value="fresh">Fresh ingredient</option>
            <option value="leftover">Leftover cooked meal</option>
            <option value="expiring">Use soon</option>
          </select>
        </div>
        {form.item_type === 'leftover' && (
          <div className="form-row"><label className="form-label">Portions remaining</label><input className="input" type="number" value={form.portions_remaining||''} onChange={e=>setForm(f=>({...f,portions_remaining:parseInt(e.target.value)}))} /></div>
        )}
        <div className="form-row"><label className="form-label">Date</label><input className="input" type="date" value={form.added_date} onChange={e=>setForm(f=>({...f,added_date:e.target.value}))} /></div>
        <div className="form-actions">
          <button className="btn btn-primary" onClick={save} disabled={!form.name}>Add</button>
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

// ── SHOPPING ──
// ── ONE-TAP SCANNER ──
// Live camera inside Yayami. Every tap on the big button = one captured item.
// The photo is read in the background; the camera stays open for the next item.
function Scanner({ items, stores, storeId, storeName, onClose, onChanged }) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [camError, setCamError] = useState(null);
  const [results, setResults] = useState([]); // {key, status:'reading'|'done'|'error'|'undone', text, undo}
  const [flash, setFlash] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
        });
        if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
        streamRef.current = stream;
        try { const tr = stream.getVideoTracks()[0]; const caps = tr.getCapabilities ? tr.getCapabilities() : {};
          if (caps.focusMode && caps.focusMode.includes('continuous')) await tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
        if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play().catch(()=>{}); }
      } catch (e) {
        setCamError(e && e.name === 'NotAllowedError'
          ? 'Camera access was not allowed. Allow it in Safari (aA menu → Website Settings → Camera) and try again.'
          : 'The camera could not be started on this device.');
      }
    })();
    return () => { cancelled = true; streamRef.current && streamRef.current.getTracks().forEach(t => t.stop()); };
  }, []);

  // Sharpness of a frame: variance of a simple Laplacian on a small grayscale copy.
  function sharpness(canvas) {
    const w = 240, h = Math.max(1, Math.round(canvas.height * 240 / canvas.width));
    const t = document.createElement('canvas'); t.width = w; t.height = h;
    const ctx = t.getContext('2d'); ctx.drawImage(canvas, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h).data;
    const g = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) g[i] = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2];
    let sum = 0, sum2 = 0, n = 0;
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const l = 4 * g[i] - g[i-1] - g[i+1] - g[i-w] - g[i+w];
      sum += l; sum2 += l * l; n++;
    }
    return n ? sum2 / n - (sum / n) ** 2 : 0;
  }

  function frameCanvas() {
    const v = videoRef.current;
    if (!v || !v.videoWidth) return null;
    const max = 1568;
    const scale = Math.min(1, max / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    return c;
  }

  // Takes 5 frames over ~0.6 s after the tap and keeps the sharpest one,
  // so the shake from pressing the button doesn't ruin the picture.
  async function grabSharpFrame() {
    const wait = ms => new Promise(r => setTimeout(r, ms));
    let best = null, bestScore = -1;
    for (let k = 0; k < 5; k++) {
      await wait(k === 0 ? 120 : 120);
      const c = frameCanvas();
      if (!c) continue;
      const sc = sharpness(c);
      if (sc > bestScore) { best = c; bestScore = sc; }
    }
    return best ? best.toDataURL('image/jpeg', 0.8).split(',')[1] : null;
  }

  function update(key, patch) { setResults(rs => rs.map(r => r.key === key ? { ...r, ...patch } : r)); }

  async function capture() {
    const key = Date.now() + Math.random();
    setResults(rs => [{ key, status: 'reading', text: 'Hold still…' }, ...rs].slice(0, 6));
    const image = await grabSharpFrame();
    if (!image) { update(key, { status: 'error', text: '✗ Camera not ready yet.' }); return; }
    setFlash(true); setTimeout(() => setFlash(false), 120);
    if (navigator.vibrate) navigator.vibrate(30);
    update(key, { text: 'Reading…' });
    const open = items.filter(i => !i.is_checked);
    try {
      const { data: s } = await supabase.auth.getSession();
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/scan-item`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${s.session.access_token}` },
        body: JSON.stringify({ image, list: open.map(i => i.name), stores: (stores||[]).map(x => x.name) })
      });
      const r = await resp.json();
      if (r.kind === 'receipt') { await saveReceipt(key, r, open, image); return; }
      if (r.kind === 'unreadable' || !resp.ok || !r.name) {
        update(key, { status: 'error', text: '✗ ' + (r.reason || 'Could not read that one.') + ' Try again.' }); return;
      }
      const label = [r.brand, r.details, r.name, r.size].filter(Boolean).join(' ');
      const priceTxt = r.price != null ? ` — $${r.price.toFixed(2)}` : ' — no price seen';
      const match = r.match_index != null ? open[r.match_index] : null;
      let budgetId = null;
      if (r.price != null) {
        const { data: b } = await supabase.from('budget_entries').insert([{ amount: r.price, category: match?.category || 'Other', is_food: match ? match.is_food : true, store_id: storeId || match?.store_id || null, notes: label + ' (scan)' }]).select('id').single();
        budgetId = b?.id || null;
      }
      let undo;
      if (match) {
        await supabase.from('shopping_items').update({ is_checked: true, price_paid: r.price }).eq('id', match.id);
        undo = async () => {
          await supabase.from('shopping_items').update({ is_checked: false, price_paid: null }).eq('id', match.id);
          if (budgetId) await supabase.from('budget_entries').delete().eq('id', budgetId);
        };
        update(key, { status: 'done', text: `✓ ${match.name} checked off${priceTxt}`, undo });
      } else {
        const { data: ins } = await supabase.from('shopping_items').insert([{ name: label, category: 'Other', store_id: storeId || null, is_food: true, is_checked: true, price_paid: r.price, source: 'scan', save_to_library: false, notes: 'Added by scan' }]).select('id').single();
        undo = async () => {
          if (ins?.id) await supabase.from('shopping_items').delete().eq('id', ins.id);
          if (budgetId) await supabase.from('budget_entries').delete().eq('id', budgetId);
        };
        update(key, { status: 'done', text: `+ ${label}${priceTxt}`, undo });
      }
      onChanged();
    } catch (e) {
      update(key, { status: 'error', text: '✗ Could not read that one. Try again, a bit closer.' });
    }
  }

  // A whole receipt: saved as a receipt with every line in detail (brand, variant,
  // size, quantity/weight, unit price, discount), plus one Budget line per product.
  // Products that were on the shopping list get checked off with their real price.
  function itemLabel(it) {
    return [it.brand, it.details, it.product || it.printed].filter(Boolean).join(' ');
  }
  function itemAmount(it) {
    const parts = [];
    if (it.quantity_unit && it.quantity_unit !== 'each') parts.push(`${it.quantity} ${it.quantity_unit}`);
    else if (it.quantity && it.quantity !== 1) parts.push(`${it.quantity} ×`);
    if (it.package_size) parts.push(`${it.package_size} ${it.package_unit || ''}`.trim());
    if (it.unit_price && it.quantity_unit && it.quantity_unit !== 'each') parts.push(`@ ${it.unit_price.toFixed(2)}/${it.quantity_unit}`);
    return parts.join(' ');
  }

  // Shopping-list matching for receipt lines, done on the phone (no AI cost):
  // every meaningful word of the list entry must appear in the decoded product.
  function findListMatch(it, open, used) {
    const hay = ' ' + [it.brand, it.details, it.product, it.printed].filter(Boolean).join(' ').toLowerCase() + ' ';
    return open.find(o => {
      if (used.has(o.id)) return false;
      const words = o.name.toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length >= 3);
      return words.length && words.every(w => hay.includes(w));
    }) || null;
  }

  async function saveReceipt(key, r, open, image) {
    const money = v => (r.currency && r.currency !== 'USD') ? `${v.toFixed(2)} ${r.currency}` : `$${v.toFixed(2)}`;
    let st = r.store_index != null ? stores[r.store_index] : null;
    // A store Yayami doesn't know yet (another town, state or country): create it automatically.
    if (!st && r.store_name) {
      const nice = r.store_name.replace(/\s+/g, ' ').trim();
      const { data: ns } = await supabase.from('stores').insert([{ name: nice + (r.city ? ` (${r.city})` : ''), type: 'supermarket', chain: r.chain,
        address: r.address, city: r.city, region: r.region, country: r.country, currency: r.currency || 'USD' }]).select('*').single();
      if (ns) st = ns;
    }
    const sid = st?.id || storeId || null;
    const used = new Set();
    r.items.forEach(it => { const m = findListMatch(it, open, used); if (m) { used.add(m.id); it.match = m; } });
    const date = r.date || new Date().toISOString().slice(0, 10);
    const sum = r.items.reduce((a, it) => a + it.price, 0) + (r.tax > 0 ? r.tax : 0);
    const total = r.total ?? sum;
    const off = r.total != null && Math.abs(sum - r.total) > 0.05;
    const where = st?.name || r.store_name || 'Receipt';

    // Already scanned? Same store, same date, same total.
    let dupQ = supabase.from('receipts').select('id').eq('purchase_date', date).eq('total', total);
    dupQ = sid ? dupQ.eq('store_id', sid) : dupQ.is('store_id', null);
    const { data: dups } = await dupQ;
    if (dups && dups.length) {
      update(key, { status: 'error', text: `🧾 This receipt (${where}, ${date}, ${money(total)}) is already saved. Nothing was added.` });
      return;
    }

    const { data: rec, error: recErr } = await supabase.from('receipts').insert([{
      store_id: sid, store_name_printed: r.store_name, purchase_date: date, purchase_time: r.time,
      subtotal: r.subtotal, tax: r.tax, total, currency: r.currency || 'USD', item_count: r.items.length, sum_matches_total: r.total != null ? !off : null
    }]).select('id').single();
    if (recErr || !rec) { update(key, { status: 'error', text: '✗ Could not save the receipt. Try again.' }); return; }

    const lines = r.items.map((it, i) => {
      const match = it.match || null;
      return { receipt_id: rec.id, line_no: i + 1, printed_text: it.printed, product: it.product, brand: it.brand, details: it.details,
        package_size: it.package_size, package_unit: it.package_unit, quantity: it.quantity, quantity_unit: it.quantity_unit,
        unit_price: it.unit_price, discount: it.discount, price: it.price, shopping_item_id: match?.id || null, item_code: it.item_code, from_dictionary: !!it.from_dictionary, category: it.category || null };
    });
    const budget = r.items.map(it => {
      const match = it.match || null;
      const amt = itemAmount(it);
      return { receipt_id: rec.id, entry_date: date, amount: it.price, category: it.category || match?.category || 'Groceries', is_food: match ? match.is_food : true, store_id: sid, currency: r.currency || 'USD', notes: itemLabel(it) + (amt ? ` (${amt})` : '') };
    });
    if (r.tax && r.tax > 0) budget.push({ receipt_id: rec.id, entry_date: date, amount: r.tax, category: 'Tax', is_food: false, store_id: sid, currency: r.currency || 'USD', notes: 'Sales tax' });
    const [li, bu] = await Promise.all([
      supabase.from('receipt_items').insert(lines),
      supabase.from('budget_entries').insert(budget)
    ]);
    if (li.error || bu.error) {
      await supabase.from('receipts').delete().eq('id', rec.id);
      update(key, { status: 'error', text: '✗ Could not save the receipt. Try again.' }); return;
    }

    // Keep the photo of the receipt (private storage, about 0.3 MB each)
    let photoPath = null;
    if (image) {
      try {
        const bin = atob(image); const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        photoPath = `${date.slice(0, 7)}/${rec.id}.jpg`;
        const { error: upErr } = await supabase.storage.from('receipts').upload(photoPath, new Blob([bytes], { type: 'image/jpeg' }), { contentType: 'image/jpeg' });
        if (upErr) photoPath = null; else await supabase.from('receipts').update({ photo_path: photoPath }).eq('id', rec.id);
      } catch (e) { photoPath = null; }
    }

    const checked = [];
    for (const it of r.items) {
      const match = it.match || null;
      if (match && !checked.find(c => c.id === match.id)) {
        await supabase.from('shopping_items').update({ is_checked: true, price_paid: it.price }).eq('id', match.id);
        checked.push(match);
      }
    }
    const undo = async () => {
      await supabase.from('receipts').delete().eq('id', rec.id); // removes its lines and Budget entries too
      if (photoPath) await supabase.storage.from('receipts').remove([photoPath]);
      for (const c of checked) await supabase.from('shopping_items').update({ is_checked: false, price_paid: null }).eq('id', c.id);
    };
    update(key, {
      status: 'done', undo,
      text: `🧾 ${where}${r.date ? ', ' + r.date : ''}: ${r.items.length} items, ${money(total)}` + (checked.length ? ` · ${checked.length} checked off the list` : '') + (r.learned && r.learned.from_dictionary ? ` · ${r.learned.from_dictionary} of ${r.items.length} lines known already` : ''),
      warn: off ? `Items add up to ${money(sum)}, but the receipt says ${money(r.total)}. Something was misread.` : null,
      details: r.items.map(it => {
        const amt = itemAmount(it);
        return `${it.from_dictionary ? '📚 ' : ''}${itemLabel(it)}${amt ? ' · ' + amt : ''} — ${money(it.price)}${it.discount ? ` (saved ${money(it.discount)})` : ''}`;
      })
    });
    onChanged();
  }

  async function doUndo(r) {
    update(r.key, { status: 'undone', text: 'Undone' });
    try { await r.undo(); } catch (e) {}
    onChanged();
  }

  return (
    <div style={{position:'fixed', inset:0, background:'#000', zIndex:1000, display:'flex', flexDirection:'column'}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 16px', color:'white', paddingTop:'max(14px, env(safe-area-inset-top))'}}>
        <div style={{fontSize:15, fontWeight:600}}>{storeName ? `Scanning at ${storeName}` : 'Scan items'}</div>
        <button onClick={onClose} style={{background:'rgba(255,255,255,0.18)', color:'white', border:'none', borderRadius:20, padding:'8px 16px', fontSize:15, fontWeight:600}}>Done</button>
      </div>
      <div style={{flex:1, position:'relative', overflow:'hidden'}}>
        {camError
          ? <div style={{color:'white', padding:24, fontSize:16, lineHeight:1.5}}>{camError}</div>
          : <video ref={videoRef} playsInline muted autoPlay style={{width:'100%', height:'100%', objectFit:'cover'}} />}
        {flash && <div style={{position:'absolute', inset:0, background:'white', opacity:0.6}} />}
        <div style={{position:'absolute', left:12, right:12, bottom:12, display:'flex', flexDirection:'column', gap:6}}>
          {results.map(r => (
            <div key={r.key} style={{background: r.status==='error' ? 'rgba(192,57,43,0.92)' : 'rgba(0,0,0,0.72)', color:'white', borderRadius:10, padding:'10px 12px', fontSize:15, display:'flex', justifyContent:'space-between', alignItems:'center', gap:10, opacity: r.status==='undone' ? 0.5 : 1}}>
              <span>{r.text}
                {r.warn && <div style={{color:'#FFD27A', fontSize:13, marginTop:4}}>⚠ {r.warn}</div>}
                {r.details && r.status==='done' && <div style={{fontSize:13, opacity:0.85, marginTop:6, maxHeight:150, overflowY:'auto', lineHeight:1.45}}>{r.details.map((d,i)=><div key={i}>{d}</div>)}</div>}
              </span>
              {r.status==='done' && r.undo && <button onClick={()=>doUndo(r)} style={{background:'white', color:'#000', border:'none', borderRadius:8, padding:'6px 12px', fontWeight:600, fontSize:14, flexShrink:0}}>Undo</button>}
            </div>
          ))}
        </div>
      </div>
      <div style={{display:'flex', justifyContent:'center', padding:'22px 0', paddingBottom:'max(22px, env(safe-area-inset-bottom))'}}>
        <button aria-label="Capture item" onClick={capture} disabled={!!camError}
          style={{width:84, height:84, borderRadius:'50%', background:'white', border:'6px solid rgba(255,255,255,0.35)', backgroundClip:'padding-box', boxShadow:'0 0 0 2px white'}} />
      </div>
    </div>
  );
}

function Shopping({ profile, unitPref }) {
  const [items, setItems] = useState([]);
  const [stores, setStores] = useState([]);
  const [library, setLibrary] = useState([]);
  const [loading, setLoading] = useState(true);
  const [storeFilter, setStoreFilter] = useState('all');
  const [showAdd, setShowAdd] = useState(false);
  const [priceModal, setPriceModal] = useState(null);
  const [scanning, setScanning] = useState(false);

  useEffect(() => {
    fetchAll();
  }, []);

  async function fetchAll() {
    setLoading(true);
    const [shopRes, storesRes, libRes] = await Promise.all([
      supabase.from('shopping_items').select('*, stores(name)').order('is_checked').order('category'),
      supabase.from('stores').select('*'),
      supabase.from('shopping_library').select('*, stores(name)').order('use_count', {ascending:false}).limit(20)
    ]);
    setItems(shopRes.data || []);
    setStores(storesRes.data || []);
    setLibrary(libRes.data || []);
    setLoading(false);
  }

  async function toggleCheck(item) {
    if (!item.is_checked) {
      setPriceModal(item);
    } else {
      await supabase.from('shopping_items').update({ is_checked: false, price_paid: null }).eq('id', item.id);
      fetchAll();
    }
  }

  async function confirmCheck(item, price) {
    await supabase.from('shopping_items').update({ is_checked: true, price_paid: price || null }).eq('id', item.id);
    if (price) {
      await supabase.from('budget_entries').insert([{ amount: price, category: item.category, is_food: item.is_food, store_id: item.store_id, notes: item.name }]);
    }
    if (item.save_to_library) {
      await supabase.from('shopping_library').upsert({ name: item.name, category: item.category, is_food: item.is_food, preferred_store_id: item.store_id, last_used: new Date().toISOString() }, { onConflict: 'name', ignoreDuplicates: false });
    }
    setPriceModal(null);
    fetchAll();
    showToast('✓ Checked off' + (price ? ` — $${price} logged` : ''));
  }

  async function clearChecked() {
    await supabase.from('shopping_items').delete().eq('is_checked', true);
    fetchAll();
    showToast('Checked items cleared');
  }

  async function addFromLibrary(lib) {
    await supabase.from('shopping_items').insert([{ name: lib.name, category: lib.category, store_id: lib.preferred_store_id, is_food: lib.is_food, source: 'manual', save_to_library: true }]);
    fetchAll();
    showToast('✓ Added: ' + lib.name);
  }

  // Auto-generate from low pantry
  async function generateFromPantry() {
    const { data: lowItems } = await supabase.from('pantry_items').select('*, stores(id)').eq('is_spice', false);
    const low = (lowItems || []).filter(p => parseFloat(p.minimum_threshold) > 0 && parseFloat(p.quantity_metric) <= parseFloat(p.minimum_threshold));
    const { data: lowSpices } = await supabase.from('pantry_items').select('*, stores(id)').eq('is_spice', true).lte('spice_level', 25);

    const toAdd = [...low.map(p => ({ name: p.name, category: 'Pantry & Canned', store_id: p.preferred_store_id, source: 'auto_pantry', is_food: true, save_to_library: true })),
      ...(lowSpices||[]).map(p => ({ name: p.name, category: 'Spices', store_id: p.preferred_store_id, source: 'auto_pantry', is_food: true, save_to_library: true }))];

    if (toAdd.length) {
      await supabase.from('shopping_items').insert(toAdd);
      fetchAll();
      showToast(`✓ Added ${toAdd.length} low-stock items`);
    } else {
      showToast('All pantry items are stocked');
    }
  }

  const filteredItems = storeFilter === 'all' ? items : items.filter(i => i.stores?.name === storeFilter);
  const byStore = stores.reduce((acc, s) => {
    const storeItems = filteredItems.filter(i => i.stores?.name === s.name);
    if (storeItems.length) acc[s.name] = storeItems;
    return acc;
  }, {});
  const noStore = filteredItems.filter(i => !i.store_id);
  const canEdit = profile?.role === 'admin' || profile?.role === 'member';

  return (
    <div>
      <h1 className="page-title">Shopping List</h1>
      <p className="page-sub">Auto-generated from pantry thresholds. Log prices as you shop to track budget.</p>
      <div style={{display:'flex', gap:8, marginBottom:14, flexWrap:'wrap'}}>
        {canEdit && <>
          <button className="btn btn-primary" onClick={()=>setScanning(true)} style={{fontSize:16, padding:'12px 20px', width:'100%', justifyContent:'center'}}>📷 Scan items</button>
          <button className="btn btn-primary" onClick={generateFromPantry}>↻ Add Low Stock Items</button>
          <button className="btn btn-secondary" onClick={()=>setShowAdd(true)}>+ Add Item</button>
          <button className="btn btn-secondary" onClick={clearChecked}>Clear Checked</button>
        </>}
      </div>

      {/* Quick-add from library */}
      {library.length > 0 && canEdit && (
        <div className="card" style={{marginBottom:14}}>
          <div className="card-header"><div className="card-title">⚡ Quick Add (saved items)</div></div>
          <div style={{padding:10, display:'flex', flexWrap:'wrap', gap:6}}>
            {library.map(lib => (
              <button key={lib.id} className="btn btn-secondary btn-xs" onClick={()=>addFromLibrary(lib)}>
                + {lib.name}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Store filter */}
      <div className="tabs">
        <button className={`tab-btn ${storeFilter==='all'?'active':''}`} onClick={()=>setStoreFilter('all')}>All Stores</button>
        {stores.map(s => <button key={s.id} className={`tab-btn ${storeFilter===s.name?'active':''}`} onClick={()=>setStoreFilter(s.name)}>{s.name}</button>)}
      </div>

      {loading ? <div className="loading">Loading…</div> :
        filteredItems.length === 0 ?
          <div className="empty-state"><div className="empty-state-icon">🛒</div>Shopping list is empty</div>
        :
        <>
          {Object.entries(byStore).map(([storeName, storeItems]) => (
            <div key={storeName} style={{marginBottom:14}}>
              <div style={{background:'var(--ink)', color:'white', padding:'10px 16px', borderRadius:'var(--radius) var(--radius) 0 0', fontWeight:600, fontSize:13, display:'flex', justifyContent:'space-between'}}>
                <span>{storeName}</span>
                <span style={{fontSize:11, opacity:0.7, fontFamily:'IBM Plex Mono,monospace'}}>{storeItems.filter(i=>!i.is_checked).length} remaining</span>
              </div>
              <div style={{background:'var(--card)', border:'1px solid var(--border)', borderTop:'none', borderRadius:'0 0 var(--radius) var(--radius)'}}>
                {storeItems.map(item => (
                  <ShopItem key={item.id} item={item} canEdit={canEdit} onToggle={()=>toggleCheck(item)} />
                ))}
              </div>
            </div>
          ))}
          {noStore.length > 0 && (
            <div style={{marginBottom:14}}>
              <div style={{background:'var(--mid)', color:'white', padding:'10px 16px', borderRadius:'var(--radius) var(--radius) 0 0', fontWeight:600, fontSize:13}}>Other</div>
              <div style={{background:'var(--card)', border:'1px solid var(--border)', borderTop:'none', borderRadius:'0 0 var(--radius) var(--radius)'}}>
                {noStore.map(item => <ShopItem key={item.id} item={item} canEdit={canEdit} onToggle={()=>toggleCheck(item)} />)}
              </div>
            </div>
          )}
        </>
      }

      {showAdd && <AddShopItemModal stores={stores} onClose={()=>setShowAdd(false)} onSaved={()=>{setShowAdd(false);fetchAll();showToast('✓ Added to list');}} />}
      {scanning && (() => { const st = stores.find(x => x.name === storeFilter); return <Scanner items={items} stores={stores} storeId={st?.id} storeName={st?.name} onClose={()=>{setScanning(false);fetchAll();}} onChanged={fetchAll} />; })()}
      {priceModal && <PriceModal item={priceModal} onConfirm={(price)=>confirmCheck(priceModal, price)} onSkip={()=>confirmCheck(priceModal, null)} onClose={()=>setPriceModal(null)} />}
    </div>
  );
}

// ── RECEIPTS ── every scanned receipt, with photo, searchable by date, store, place, item and category
function Receipts({ profile }) {
  const [receipts, setReceipts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [q, setQ] = useState('');
  const [period, setPeriod] = useState('all'); // all | day | week | month
  const [day, setDay] = useState(new Date().toISOString().slice(0, 10));
  const [month, setMonth] = useState(new Date().toISOString().slice(0, 7));
  const [store, setStore] = useState('');
  const [country, setCountry] = useState('');
  const [category, setCategory] = useState('');
  const [openId, setOpenId] = useState(null);
  const [photoUrl, setPhotoUrl] = useState({});

  useEffect(() => { load(); }, []);
  async function load() {
    setLoading(true);
    const { data } = await supabase.from('receipts')
      .select('*, stores(name, city, region, country), receipt_items(*)')
      .order('purchase_date', { ascending: false }).order('created_at', { ascending: false }).limit(1000);
    setReceipts(data || []);
    setLoading(false);
  }

  async function toggle(r) {
    if (openId === r.id) { setOpenId(null); return; }
    setOpenId(r.id);
    if (r.photo_path && !photoUrl[r.id]) {
      const { data } = await supabase.storage.from('receipts').createSignedUrl(r.photo_path, 3600);
      if (data?.signedUrl) setPhotoUrl(p => ({ ...p, [r.id]: data.signedUrl }));
    }
  }

  const money = (v, cur) => v == null ? '–' : (cur && cur !== 'USD') ? `${Number(v).toFixed(2)} ${cur}` : `$${Number(v).toFixed(2)}`;
  const place = r => [r.stores?.city, r.stores?.region, r.stores?.country].filter(Boolean).join(', ');
  const label = it => [it.brand, it.details, it.product || it.printed_text].filter(Boolean).join(' ');
  const amount = it => {
    const p = [];
    if (it.quantity_unit && it.quantity_unit !== 'each') p.push(`${it.quantity} ${it.quantity_unit}`);
    else if (it.quantity && Number(it.quantity) !== 1) p.push(`${it.quantity} ×`);
    if (it.package_size) p.push(`${it.package_size} ${it.package_unit || ''}`.trim());
    return p.join(' ');
  };

  // Week = Monday to Sunday around the chosen day
  function inPeriod(d) {
    if (period === 'all') return true;
    if (!d) return false;
    if (period === 'day') return d === day;
    if (period === 'month') return d.slice(0, 7) === month;
    const base = new Date(day + 'T12:00:00');
    const mon = new Date(base); mon.setDate(base.getDate() - ((base.getDay() + 6) % 7));
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    const iso = x => x.toISOString().slice(0, 10);
    return d >= iso(mon) && d <= iso(sun);
  }

  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const itemHit = it => {
    if (category && it.category !== category) return false;
    if (!words.length) return true;
    const hay = [it.product, it.brand, it.details, it.printed_text, it.category].filter(Boolean).join(' ').toLowerCase();
    return words.every(w => hay.includes(w));
  };
  const filtered = receipts.map(r => {
    if (!inPeriod(r.purchase_date)) return null;
    if (store && r.stores?.name !== store) return null;
    if (country && r.stores?.country !== country) return null;
    const head = [r.stores?.name, r.store_name_printed, r.stores?.city, r.stores?.region, r.stores?.country].filter(Boolean).join(' ').toLowerCase();
    const headHit = words.length && words.every(w => head.includes(w));
    const hits = (r.receipt_items || []).filter(itemHit);
    if (category && !hits.length) return null;
    if (words.length && !headHit && !hits.length) return null;
    return { ...r, hits: (words.length && !headHit) || category ? hits : null };
  }).filter(Boolean);

  const totals = filtered.reduce((acc, r) => {
    const cur = r.currency || 'USD';
    const v = r.hits ? r.hits.reduce((a, it) => a + Number(it.price), 0) : Number(r.total || 0);
    acc[cur] = (acc[cur] || 0) + v; return acc;
  }, {});
  const storeNames = [...new Set(receipts.map(r => r.stores?.name).filter(Boolean))].sort();
  const countries = [...new Set(receipts.map(r => r.stores?.country).filter(Boolean))].sort();
  const categories = [...new Set(receipts.flatMap(r => (r.receipt_items || []).map(it => it.category)).filter(Boolean))].sort();
  const big = { fontSize: 15 };

  return (
    <div>
      <h1 className="page-title">Receipts</h1>
      <p className="page-sub">Every scanned receipt with its photo. Search by item, brand, store, city or country, and filter by date and category.</p>

      <div className="card" style={{marginBottom:14}}>
        <div className="card-body" style={{display:'flex', flexDirection:'column', gap:10}}>
          <input className="input" style={big} placeholder="Search: e.g. milk, Tillamook, organic, Fred Meyer, Bend, DE …" value={q} onChange={e=>setQ(e.target.value)} />
          <div className="tabs" style={{marginBottom:0}}>
            {[['all','All dates'],['day','Day'],['week','Week'],['month','Month']].map(([k,l]) =>
              <button key={k} className={`tab-btn ${period===k?'active':''}`} onClick={()=>setPeriod(k)}>{l}</button>)}
          </div>
          {(period === 'day' || period === 'week') && <input className="input" style={big} type="date" value={day} onChange={e=>setDay(e.target.value)} />}
          {period === 'month' && <input className="input" style={big} type="month" value={month} onChange={e=>setMonth(e.target.value)} />}
          <div className="grid-3">
            <select className="input" style={big} value={store} onChange={e=>setStore(e.target.value)}>
              <option value="">All stores</option>{storeNames.map(s => <option key={s}>{s}</option>)}
            </select>
            <select className="input" style={big} value={category} onChange={e=>setCategory(e.target.value)}>
              <option value="">All categories</option>{categories.map(c => <option key={c}>{c}</option>)}
            </select>
            <select className="input" style={big} value={country} onChange={e=>setCountry(e.target.value)}>
              <option value="">All countries</option>{countries.map(c => <option key={c}>{c}</option>)}
            </select>
          </div>
        </div>
      </div>

      {!loading && <div style={{fontSize:15, marginBottom:10, color:'var(--ink2)'}}>
        <b>{filtered.length}</b> receipt{filtered.length === 1 ? '' : 's'}
        {Object.keys(totals).length > 0 && <> · {Object.entries(totals).map(([cur, v]) => money(v, cur)).join(' + ')}</>}
        {(words.length > 0 || category) && <span style={{color:'var(--mid)'}}> (matching items only)</span>}
      </div>}

      {loading ? <div className="loading">Loading…</div> :
        filtered.length === 0 ? <div className="empty-state"><div className="empty-state-icon">🧾</div>No receipts found</div> :
        filtered.map(r => (
          <div key={r.id} className="card" style={{marginBottom:10}}>
            <div onClick={()=>toggle(r)} style={{padding:'12px 16px', cursor:'pointer', display:'grid', gridTemplateColumns:'1fr auto', gap:8, alignItems:'center'}}>
              <div>
                <div style={{fontSize:16, fontWeight:600}}>{r.stores?.name || r.store_name_printed || 'Unknown store'}</div>
                <div style={{fontSize:13, color:'var(--mid)', fontFamily:'IBM Plex Mono,monospace'}}>
                  {r.purchase_date}{r.purchase_time ? ' ' + r.purchase_time : ''}{place(r) ? ' · ' + place(r) : ''} · {r.item_count} items{r.photo_path ? ' · 📷' : ''}
                </div>
                {r.hits && <div style={{fontSize:14, marginTop:4, color:'var(--sage-dark)'}}>{r.hits.map(label).join(' · ')}</div>}
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:17, fontWeight:600, fontFamily:'IBM Plex Mono,monospace'}}>{money(r.total, r.currency)}</div>
                {r.sum_matches_total === false && <div style={{fontSize:12, color:'var(--gold)'}}>⚠ check</div>}
              </div>
            </div>
            {openId === r.id && (
              <div style={{borderTop:'1px solid var(--border)'}}>
                {(r.receipt_items || []).sort((a,b)=>(a.line_no||0)-(b.line_no||0)).map(it => (
                  <div key={it.id} style={{display:'grid', gridTemplateColumns:'1fr auto', gap:10, padding:'10px 16px', borderBottom:'1px solid #000', background: r.hits && r.hits.find(h=>h.id===it.id) ? 'var(--sage-bg)' : 'transparent'}}>
                    <div>
                      <div style={{fontSize:15, fontWeight:600}}>{label(it)}</div>
                      <div style={{fontSize:13, color:'var(--mid)'}}>
                        {[amount(it), it.unit_price && it.quantity_unit !== 'each' ? `@ ${Number(it.unit_price).toFixed(2)}/${it.quantity_unit}` : null, it.category, it.printed_text ? `“${it.printed_text}”` : null].filter(Boolean).join(' · ')}
                      </div>
                    </div>
                    <div style={{textAlign:'right', fontFamily:'IBM Plex Mono,monospace', fontSize:15}}>
                      {money(it.price, r.currency)}
                      {it.discount ? <div style={{fontSize:12, color:'var(--sage)'}}>saved {money(it.discount, r.currency)}</div> : null}
                    </div>
                  </div>
                ))}
                <div style={{padding:'10px 16px', fontSize:14, display:'flex', gap:16, flexWrap:'wrap', fontFamily:'IBM Plex Mono,monospace'}}>
                  {r.subtotal != null && <span>Subtotal {money(r.subtotal, r.currency)}</span>}
                  {r.tax != null && <span>Tax {money(r.tax, r.currency)}</span>}
                  <span><b>Total {money(r.total, r.currency)}</b></span>
                </div>
                {r.photo_path && (photoUrl[r.id]
                  ? <a href={photoUrl[r.id]} target="_blank" rel="noopener"><img src={photoUrl[r.id]} alt="Receipt photo" style={{width:'100%', display:'block'}} /></a>
                  : <div className="loading">Loading photo…</div>)}
              </div>
            )}
          </div>
        ))}
    </div>
  );
}

// ── BUDGET ──
function Budget({ profile }) {
  const [entries, setEntries] = useState([]);
  const [config, setConfig] = useState({ monthly_target: 450 });
  const [loading, setLoading] = useState(true);
  const [showAdd, setShowAdd] = useState(false);

  useEffect(() => { fetchData(); }, []);

  async function fetchData() {
    setLoading(true);
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
    const [entriesRes, configRes] = await Promise.all([
      supabase.from('budget_entries').select('*, stores(name)').gte('entry_date', monthStart).order('entry_date', {ascending:false}),
      supabase.from('budget_config').select('*').single()
    ]);
    setEntries(entriesRes.data || []);
    setConfig(configRes.data || { monthly_target: 450 });
    setLoading(false);
  }

  async function removeEntry(e) {
    if (!window.confirm(`Delete this Budget entry?\n\n${e.notes || e.category}\n${e.entry_date} · $${parseFloat(e.amount).toFixed(2)}`)) return;
    const { error } = await supabase.from('budget_entries').delete().eq('id', e.id);
    if (error) { showToast('Could not delete: ' + error.message); return; }
    setEntries(list => list.filter(x => x.id !== e.id));
    showToast('✓ Entry deleted');
  }

  const totalMonth = entries.reduce((a, e) => a + parseFloat(e.amount), 0);
  const target = parseFloat(config.monthly_target);
  const pct = Math.min(100, (totalMonth / target) * 100);
  const barColor = pct > 90 ? 'var(--red)' : pct > 70 ? 'var(--gold)' : 'var(--sage)';

  const now = new Date();
  const weekStart = new Date(now.setDate(now.getDate() - now.getDay())).toISOString().split('T')[0];
  const weekTotal = entries.filter(e => e.entry_date >= weekStart).reduce((a, e) => a + parseFloat(e.amount), 0);

  const byCategory = entries.reduce((acc, e) => {
    acc[e.category || 'Other'] = (acc[e.category || 'Other'] || 0) + parseFloat(e.amount);
    return acc;
  }, {});

  return (
    <div>
      <h1 className="page-title">Budget Tracker</h1>
      <p className="page-sub">Target: ${target}/month for 3 people. Log prices when shopping to track spend.</p>

      <div className="grid-3" style={{marginBottom:16}}>
        <div className="stat-box">
          <div className="stat-label">This Month</div>
          <div className="stat-val" style={{color:barColor}}>${totalMonth.toFixed(0)}</div>
          <div className="budget-bar-wrap" style={{marginTop:6}}><div className="budget-bar" style={{width:pct+'%', background:barColor}}></div></div>
          <div className="stat-sub">${(target-totalMonth).toFixed(0)} remaining of ${target}</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">This Week</div>
          <div className="stat-val" style={{color: weekTotal > 120 ? 'var(--red)' : 'var(--sage)'}}>${weekTotal.toFixed(0)}</div>
          <div className="stat-sub">Target ~$105/week</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Daily Average</div>
          <div className="stat-val">${(totalMonth / new Date().getDate()).toFixed(1)}</div>
          <div className="stat-sub">Target ~$15/day</div>
        </div>
      </div>

      <div className="grid-2" style={{marginBottom:16}}>
        <div className="card">
          <div className="card-header">
            <div className="card-title">By Category</div>
            {profile?.role === 'admin' && <button className="btn btn-sm btn-primary" onClick={()=>setShowAdd(true)}>+ Log Spend</button>}
          </div>
          <div className="card-body">
            {Object.entries(byCategory).sort((a,b)=>b[1]-a[1]).map(([cat, amt]) => (
              <div key={cat} style={{display:'flex', justifyContent:'space-between', padding:'5px 0', borderBottom:'1px solid var(--bg)', fontSize:13}}>
                <span>{cat}</span>
                <strong style={{fontFamily:'IBM Plex Mono,monospace'}}>${amt.toFixed(2)}</strong>
              </div>
            ))}
          </div>
        </div>
        <div className="card">
          <div className="card-header"><div className="card-title">Recent Entries</div></div>
          <div className="card-body" style={{maxHeight:520, overflowY:'auto'}}>
            {loading ? <div className="loading">Loading…</div> :
              entries.map(e => (
                <div key={e.id} style={{display:'grid', gridTemplateColumns:'1fr auto auto', gap:10, alignItems:'center', padding:'8px 0', borderBottom:'1px solid #000', fontSize:14}}>
                  <div>
                    <div style={{fontWeight:500}}>{e.receipt_id ? '🧾 ' : ''}{e.notes || e.category}</div>
                    <div style={{color:'var(--mid)', fontSize:12}}>{e.entry_date} · {e.stores?.name || 'no store'}</div>
                  </div>
                  <strong style={{fontFamily:'IBM Plex Mono,monospace', color:'var(--terra)'}}>${parseFloat(e.amount).toFixed(2)}</strong>
                  {profile?.role !== 'guest'
                    ? <button aria-label="Delete entry" onClick={()=>removeEntry(e)} style={{border:'1px solid var(--border)', background:'var(--card)', borderRadius:8, padding:'6px 10px', fontSize:15, cursor:'pointer'}}>🗑</button>
                    : <span />}
                </div>
              ))
            }
          </div>
        </div>
      </div>

      {showAdd && <AddBudgetModal onClose={()=>setShowAdd(false)} onSaved={()=>{setShowAdd(false);fetchData();showToast('✓ Spend logged');}} />}
    </div>
  );
}

    onSaved();
  }

  return (

        <div className="form-row"><label className="form-label">Amount ($)</label><input className="input" type="number" step="0.01" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} /></div>
        <div className="grid-2">
          <div className="form-row"><label className="form-label">Category</label>
            <select className="input" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
              {CATS.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div className="form-row"><label className="form-label">Store</label>
            <select className="input" value={storeId} onChange={e=>setStoreId(e.target.value)}>
              <option value="">—</option>
              {stores.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
          </div>
        </div>
        <div className="form-row"><label className="form-label">Notes</label><input className="input" value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="e.g. chicken thighs, 3lb" /></div>
        <div className="form-row"><label className="form-label">Date</label><input className="input" type="date" value={form.entry_date} onChange={e=>setForm(f=>({...f,entry_date:e.target.value}))} /></div>
        <div className="form-actions">
          <button className="btn btn-primary" onClick={save} disabled={!form.amount}>Save</button>
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

// ── PROTEIN TRACKER ──
function ProteinTracker({ profile }) {
  const [logs, setLogs] = useState([]);
  const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
  const [proteinTarget, setProteinTarget] = useState(90);
  const SOURCES = [
    {name:'Hemp seeds (3 tbsp)', g:10},
    {name:'Eggs ×2', g:12},
    {name:'Firm tofu (150g)', g:15},
    {name:'Tempeh (100g)', g:19},
    {name:'Red lentils (150g)', g:13},
    {name:'Chickpeas (150g)', g:11},
    {name:'Edamame (100g)', g:11},
    {name:'Greek yoghurt (150g)', g:15},
    {name:'Cornflakes + milk', g:7},
    {name:'Dal dinner portion', g:16},
    {name:'Egg fried rice', g:14},
    {name:'Kefir (200ml)', g:7},
    {name:'Skyr (150g)', g:17},
    {name:'Chicken thigh (150g)', g:28},
    {name:'Salmon fillet (150g)', g:30},
    {name:'Beef (150g)', g:31},
    {name:'Cheddar (50g)', g:13},
    {name:'Whole milk (250ml)', g:8},
  ];

  useEffect(() => { fetchLogs(); }, [selectedDate]);

  async function fetchLogs() {
    const userId = (await supabase.auth.getUser()).data.user?.id;
    const { data } = await supabase.from('protein_logs').select('*').eq('log_date', selectedDate).order('created_at');
    setLogs(data || []);
  }

  async function toggleSource(source) {
    const userId = (await supabase.auth.getUser()).data.user?.id;
    const existing = logs.find(l => l.food_name === source.name);
    if (existing) {
      await supabase.from('protein_logs').delete().eq('id', existing.id);
    } else {
      await supabase.from('protein_logs').insert([{ user_id: userId, log_date: selectedDate, food_name: source.name, protein_g: source.g }]);
    }
    fetchLogs();
  }

  const total = logs.reduce((a, l) => a + l.protein_g, 0);
  const pct = Math.min(100, (total/proteinTarget)*100);
  const color = pct >= 85 ? 'var(--sage)' : pct >= 55 ? 'var(--gold)' : 'var(--red)';
  const name = profile?.name || 'You';

  return (
    <div>
      <h1 className="page-title">Nutrition — {name}</h1>
      <p className="page-sub">Track daily protein intake. Each household member tracks their own. Phase 3 will add full macro tracking, photo logging, and goal-based recommendations.</p>

      <div style={{background:'linear-gradient(135deg, #2C3E50, #3D5A6E)', color:'white', borderRadius:'var(--radius)', padding:'16px 20px', marginBottom:16}}>
        <div style={{display:'flex', alignItems:'center', gap:12, marginBottom:10, flexWrap:'wrap'}}>
          <input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)} style={{background:'rgba(255,255,255,0.1)', border:'1px solid rgba(255,255,255,0.2)', borderRadius:8, padding:'6px 10px', color:'white', fontFamily:'IBM Plex Sans,sans-serif', fontSize:13}} />
          <div style={{fontFamily:'Lora,serif', fontSize:28}}>{total}g <span style={{fontSize:14, opacity:0.7}}>/ {proteinTarget}g protein target</span></div>
          <div style={{marginLeft:'auto', display:'flex', alignItems:'center', gap:6, fontSize:12}}>
            <span style={{opacity:0.7}}>Target:</span>
            <input type="number" value={proteinTarget} onChange={e=>setProteinTarget(parseInt(e.target.value)||90)} style={{width:60, background:'rgba(255,255,255,0.1)', border:'1px solid rgba(255,255,255,0.2)', borderRadius:6, padding:'4px 8px', color:'white', fontFamily:'IBM Plex Mono,sans-serif', fontSize:13}} />
            <span style={{opacity:0.7}}>g</span>
          </div>
        </div>
        <div style={{height:12, background:'rgba(255,255,255,0.15)', borderRadius:6, overflow:'hidden'}}>
          <div style={{height:'100%', width:pct+'%', background:color, borderRadius:6, transition:'width 0.5s'}}></div>
        </div>
        <div style={{fontSize:12, marginTop:6, opacity:0.7}}>
          {pct >= 85 ? '✅ Good — target reached!' : pct >= 55 ? '⚠️ Getting there — keep going' : '🔴 Low — needs attention today'}
        </div>
      </div>

      <div className="card" style={{marginBottom:14}}>
        <div className="card-header"><div className="card-title">Click to add / remove protein sources for {name}</div></div>
        <div style={{padding:14, display:'flex', flexWrap:'wrap', gap:8}}>
          {SOURCES.map(s => {
            const added = logs.some(l => l.food_name === s.name);
            return (
              <button key={s.name} onClick={()=>toggleSource(s)} style={{padding:'6px 12px', borderRadius:20, border:'1px solid', fontSize:12, cursor:'pointer', fontFamily:'IBM Plex Sans,sans-serif', fontWeight:500, transition:'all 0.15s',
                background: added ? 'var(--sage)' : 'var(--card)',
                color: added ? 'white' : 'var(--ink)',
                borderColor: added ? 'var(--sage)' : 'var(--border)'
              }}>
                {s.name} (+{s.g}g)
              </button>
            );
          })}
        </div>
      </div>

      <div className="card">
        <div className="card-header"><div className="card-title">Protein reference — quick guide</div></div>
        <table className="table">
          <thead><tr><th>Food</th><th>Serving</th><th>Protein</th><th>~Cost</th></tr></thead>
          <tbody>
            {[
              ['🌿 Hemp seeds','3 tbsp','10g','~$0.30'],
              ['🫘 Tempeh','100g','19g','~$0.80'],
              ['🥚 Eggs ×2','2 large','12g','~$0.55'],
              ['🫘 Firm tofu','150g','15g','~$0.60'],
              ['🟤 Red lentils','150g cooked','13g','~$0.20'],
              ['🫘 Chickpeas','150g cooked','11g','~$0.15'],
              ['🟢 Edamame','100g','11g','~$0.40'],
              ['🥛 Skyr','150g','17g','~$0.40'],
              ['🍗 Chicken thigh','150g','28g','~$1.20'],
              ['🐟 Salmon','150g','30g','~$2.50'],
              ['🥩 Beef','150g','31g','~$1.80'],
            ].map(([f,s,p,c])=>(
              <tr key={f}><td>{f}</td><td style={{color:'var(--mid)'}}>{s}</td><td style={{color:'var(--sage)',fontFamily:'IBM Plex Mono,monospace',fontWeight:600}}>{p}</td><td style={{color:'var(--mid)'}}>{c}</td></tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── FERMENTS ──
function Ferments({ profile }) {
  const [logs, setLogs] = useState([]);
  const [activeTab, setActiveTab] = useState('kefir');
  const [showLog, setShowLog] = useState(false);

  useEffect(() => { fetchLogs(); }, []);

  async function fetchLogs() {
    const { data } = await supabase.from('ferment_logs').select('*, profiles(name)').order('logged_at', {ascending:false}).limit(40);
    setLogs(data || []);
  }

  async function addLog(type, action, notes, batchSize) {
    const userId = (await supabase.auth.getUser()).data.user?.id;
    await supabase.from('ferment_logs').insert([{ ferment_type: type, action, notes, batch_size_ml: batchSize || null, logged_by: userId }]);
    fetchLogs();
    showToast('✓ Logged');
  }

  const FERMENTS = [
    { key: 'kefir', label: '🥛 Kefir', desc: 'Continuous culture · 2–3 tbsp grains · 1L milk · 24hrs room temp · Low lactose — good for Maxi' },
    { key: 'skyr', label: '🫙 Skyr', desc: 'Friday evening batch · 2L milk → strain 12hrs · ~700g · 15–17g protein/150g' },
    { key: 'greek_yoghurt', label: '🥄 Greek Yoghurt', desc: 'Same batch as skyr · strain only 2–4hrs · creamier · use for raita, cooking' },
    { key: 'sourdough_starter', label: '🌾 Sourdough Starter', desc: 'Keep 20–30g always · feed weekly in fridge · discard into roti/pancakes' },
  ];

  const ACTIONS = { kefir: ['started','completed','discarded'], skyr: ['started','strained','completed'], greek_yoghurt: ['started','strained','completed'], sourdough_starter: ['fed','discarded'] };

  const activeFerment = FERMENTS.find(f => f.key === activeTab);
  const fermentLogs = logs.filter(l => l.ferment_type === activeTab);
  const lastLog = fermentLogs[0];

  const canEdit = profile?.role === 'admin' || profile?.role === 'member';

  return (
    <div>
      <h1 className="page-title">Ferments</h1>
      <p className="page-sub">Four live cultures. Track batches, actions, and history.</p>

      <div className="grid-4" style={{marginBottom:16}}>
        {FERMENTS.map(f => {
          const last = logs.find(l => l.ferment_type === f.key);
          return (
            <div key={f.key} className="stat-box" style={{cursor:'pointer', border: activeTab===f.key ? '2px solid var(--sage)':''}} onClick={()=>setActiveTab(f.key)}>
              <div className="stat-label">{f.label}</div>
              <div style={{fontSize:12, color:'var(--mid)', marginTop:4}}>{last ? new Date(last.logged_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' · ' + last.action : 'Not logged yet'}</div>
            </div>
          );
        })}
      </div>

      <div className="card">
        <div className="card-header">
          <div className="card-title">{activeFerment?.label}</div>
          {canEdit && (
            <div style={{display:'flex', gap:6}}>
              {(ACTIONS[activeTab]||[]).map(action => (
                <button key={action} className="btn btn-sm btn-primary" onClick={async()=>{
                  const notes = prompt(`Notes for "${action}" (optional):`);
                  const batch = activeTab !== 'sourdough_starter' ? parseInt(prompt('Batch size in ml? (optional, skip to leave blank):')||'0')||null : null;
                  await addLog(activeTab, action, notes||'', batch);
                }}>{action}</button>
              ))}
            </div>
          )}
        </div>
        <div className="card-body">
          <p style={{fontSize:13, color:'var(--mid)', marginBottom:14, lineHeight:1.6}}>{activeFerment?.desc}</p>
          {fermentLogs.length === 0
            ? <div style={{color:'var(--muted)', fontSize:13}}>No logs yet — start logging your batches!</div>
            : fermentLogs.map(log => (
                <div key={log.id} style={{display:'flex', gap:12, padding:'8px 0', borderBottom:'1px solid var(--bg)', fontSize:13, alignItems:'start'}}>
                  <span style={{fontFamily:'IBM Plex Mono,monospace', fontSize:11, color:'var(--muted)', whiteSpace:'nowrap', paddingTop:2}}>{new Date(log.logged_at).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
                  <span className="tag" style={{background:'var(--sage-bg)', color:'var(--sage)', flexShrink:0}}>{log.action}</span>
                  <span style={{color:'var(--mid)'}}>{log.notes || '—'}{log.batch_size_ml ? ` · ${log.batch_size_ml}ml` : ''}</span>
                  <span style={{marginLeft:'auto', fontSize:11, color:'var(--muted)'}}>{log.profiles?.name}</span>
                </div>
              ))
          }
        </div>
      </div>
    </div>
  );
}

// ── INSTRUCTIONS ──
function Instructions({ profile }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [catFilter, setCatFilter] = useState('all');
  const [selected, setSelected] = useState(null);

  useEffect(() => { fetchInstructions(); }, []);

  async function fetchInstructions() {
    setLoading(true);
    const { data, error } = await supabase.from('instructions').select('*').order('sort_order');
    console.log('Instructions:', JSON.stringify(data), JSON.stringify(error));
    setItems(data || []);
    if (data?.length) setSelected(data[0]);
    setLoading(false);
  }

  const CAT_ICONS = { bread: '🍞', ferments: '🫙', techniques: '🔪', other: '📖' };
  const CAT_LABELS = { bread: 'Bread', ferments: 'Ferments', techniques: 'Techniques', other: 'Other' };

  const filtered = catFilter === 'all' ? items : items.filter(i => i.category === catFilter);
  const cats = [...new Set(items.map(i => i.category))];

  return (
    <div>
      <h1 className="page-title">Instructions</h1>
      <p className="page-sub">Bread baking, ferments, and techniques — all stored in your database. Select any guide to read the full step-by-step.</p>

      <div className="tabs" style={{marginBottom: 16}}>
        <button className={`tab-btn ${catFilter==='all'?'active':''}`} onClick={()=>setCatFilter('all')}>All</button>
        {cats.map(c => (
          <button key={c} className={`tab-btn ${catFilter===c?'active':''}`} onClick={()=>setCatFilter(c)}>
            {CAT_ICONS[c]} {CAT_LABELS[c]}
          </button>
        ))}
      </div>

      {loading ? <div className="loading">Loading instructions…</div> : (
        <div style={{display:'grid', gridTemplateColumns:'280px 1fr', gap:16}}>
          {/* Sidebar */}
          <div>
            {filtered.map(item => (
              <div key={item.id} onClick={()=>setSelected(item)} style={{
                background: selected?.id===item.id ? 'var(--ink)' : 'var(--card)',
                color: selected?.id===item.id ? 'white' : 'var(--ink)',
                border: `1px solid ${selected?.id===item.id ? 'var(--ink)' : 'var(--border)'}`,
                borderRadius: 'var(--radius)', padding:'12px 14px', marginBottom:8,
                cursor:'pointer', transition:'all 0.15s'
              }}>
                <div style={{fontWeight:600, fontSize:14}}>{CAT_ICONS[item.category]} {item.title}</div>
                <div style={{fontSize:12, opacity:0.7, marginTop:3}}>{item.subtitle}</div>
                {item.metadata && (
                  <div style={{display:'flex', gap:8, marginTop:6, flexWrap:'wrap'}}>
                    {item.metadata.total_time && <span style={{fontSize:10, background:'rgba(255,255,255,0.15)', padding:'1px 6px', borderRadius:10, fontFamily:'IBM Plex Mono,monospace'}}>⏱ {item.metadata.total_time}</span>}
                    {item.metadata.hydration && <span style={{fontSize:10, background:'rgba(255,255,255,0.15)', padding:'1px 6px', borderRadius:10, fontFamily:'IBM Plex Mono,monospace'}}>{item.metadata.hydration}</span>}
                    {item.metadata.keeps && <span style={{fontSize:10, background:'rgba(255,255,255,0.15)', padding:'1px 6px', borderRadius:10, fontFamily:'IBM Plex Mono,monospace'}}>Keeps {item.metadata.keeps}</span>}
                  </div>
                )}
              </div>
            ))}
          </div>

          {/* Detail */}
          {selected ? (
            <div className="card">
              <div style={{background:'var(--ink)', color:'white', padding:'20px 24px', borderRadius:'var(--radius) var(--radius) 0 0'}}>
                <div style={{fontSize:12, fontFamily:'IBM Plex Mono,monospace', opacity:0.6, textTransform:'uppercase', letterSpacing:1, marginBottom:6}}>{CAT_ICONS[selected.category]} {CAT_LABELS[selected.category]}</div>
                <div style={{fontFamily:'Lora,serif', fontSize:24, marginBottom:4}}>{selected.title}</div>
                <div style={{fontSize:13, opacity:0.75}}>{selected.subtitle}</div>
                {selected.metadata && (
                  <div style={{display:'flex', gap:16, marginTop:14, flexWrap:'wrap'}}>
                    {Object.entries(selected.metadata).map(([k,v]) => (
                      <div key={k}>
                        <div style={{fontSize:10, textTransform:'uppercase', letterSpacing:1, opacity:0.5, fontFamily:'IBM Plex Mono,monospace'}}>{k.replace(/_/g,' ')}</div>
                        <div style={{fontSize:13, fontWeight:600}}>{v}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <div style={{padding:'20px 24px'}}>
                {selected.intro && <p style={{fontSize:14, color:'var(--mid)', lineHeight:1.7, marginBottom:20, borderLeft:'3px solid var(--sage)', paddingLeft:14}}>{selected.intro}</p>}

                {/* Steps */}
                {selected.steps?.length > 0 && (
                  <div style={{marginBottom:24}}>
                    <div style={{fontWeight:700, fontSize:13, textTransform:'uppercase', letterSpacing:1, color:'var(--mid)', fontFamily:'IBM Plex Mono,monospace', marginBottom:12}}>Steps</div>
                    {selected.steps.map((step, i) => (
                      <div key={i} style={{display:'flex', gap:14, padding:'14px 0', borderBottom:'1px solid var(--bg)', alignItems:'start'}}>
                        <div style={{width:28, height:28, borderRadius:'50%', background:'var(--sage)', color:'white', display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, fontWeight:700, flexShrink:0}}>{step.num}</div>
                        <div style={{flex:1}}>
                          <div style={{fontWeight:600, fontSize:14, marginBottom:5}}>{step.title}</div>
                          <div style={{fontSize:13, color:'var(--mid)', lineHeight:1.7}}>{step.desc}</div>
                          {step.timer && (
                            <div style={{marginTop:8, display:'inline-flex', alignItems:'center', gap:6, background:'var(--blue-bg)', color:'var(--blue)', padding:'3px 10px', borderRadius:20, fontSize:12, fontFamily:'IBM Plex Mono,monospace'}}>
                              ⏱ {step.timer}
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* Tips */}
                {selected.tips?.length > 0 && (
                  <div>
                    <div style={{fontWeight:700, fontSize:13, textTransform:'uppercase', letterSpacing:1, color:'var(--mid)', fontFamily:'IBM Plex Mono,monospace', marginBottom:12}}>💡 Key Tips</div>
                    {selected.tips.map((t, i) => (
                      <div key={i} style={{background:'var(--gold-bg)', borderRadius:8, padding:'10px 14px', marginBottom:8, fontSize:13, color:'var(--ink)', lineHeight:1.6}}>
                        {t.tip}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          ) : (
            <div className="empty-state"><div className="empty-state-icon">📖</div>Select an instruction from the left</div>
          )}
        </div>
      )}
    </div>
  );
}
